name: Debug UI crash

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  ui:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: W1-send-alone, nofix: "1", fake: "0", sel: "tests/session/test_dbg_trash.py tests/ui" }
          - { name: W2-T2-fake-trash, nofix: "1", fake: "1", sel: "tests/session/test_mods_entry_ops.py::test_removing_an_entry_undo_brings_back_runs_at_once_and_its_record_undoes_it_byte_exact tests/ui" }
          - { name: W3-T2-control, nofix: "1", fake: "0", sel: "tests/session/test_mods_entry_ops.py::test_removing_an_entry_undo_brings_back_runs_at_once_and_its_record_undoes_it_byte_exact tests/ui" }
          - { name: W4-send-alone-twice, nofix: "1", fake: "0", sel: "tests/session/test_dbg_trash.py tests/ui" }
          - { name: W5-T2-fake-trash-again, nofix: "1", fake: "1", sel: "tests/session/test_mods_entry_ops.py::test_removing_an_entry_undo_brings_back_runs_at_once_and_its_record_undoes_it_byte_exact tests/ui" }
    name: ${{ matrix.name }}
    env:
      QT_QPA_PLATFORM: offscreen
      RS_UI_STALL_MS: 1500
      PYTHONFAULTHANDLER: "1"
      DBG_FAKETRASH: ${{ matrix.fake }}
      PYTHONPATH: .github/debug
      QT_LOGGING_RULES: "qt.qml*=true;qt.quick*=true"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: true
    - run: uv sync --locked
    - name: Probe COM state around the Recycle Bin call
      shell: bash
      run: uv run python .github/debug/com.py
    - name: Put the original trash.py back
      if: matrix.nofix == '1'
      shell: bash
      run: cp .github/debug/trash_orig.py src/bayle/platform/trash.py
    - name: Run
      shell: bash
      run: uv run python -X faulthandler -m pytest -v -p dbgplug -p no:cacheprovider ${{ matrix.sel }}
