name: Debug UI crash

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  ui:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: S-activity_ops, cov: "0", sel: "tests/session/test_activity_ops.py tests/ui" }
          - { name: S-events, cov: "0", sel: "tests/session/test_events.py tests/ui" }
          - { name: S-job_manager, cov: "0", sel: "tests/session/test_job_manager.py tests/ui" }
          - { name: S-mods_entry_ops, cov: "0", sel: "tests/session/test_mods_entry_ops.py tests/ui" }
          - { name: S-mods_install_ops, cov: "0", sel: "tests/session/test_mods_install_ops.py tests/ui" }
          - { name: S-mods_library_ops, cov: "0", sel: "tests/session/test_mods_library_ops.py tests/ui" }
          - { name: S-mods_ops, cov: "0", sel: "tests/session/test_mods_ops.py tests/ui" }
          - { name: S-mods_overhaul_ops, cov: "0", sel: "tests/session/test_mods_overhaul_ops.py tests/ui" }
          - { name: S-mods_profile_ops, cov: "0", sel: "tests/session/test_mods_profile_ops.py tests/ui" }
          - { name: S-operations, cov: "0", sel: "tests/session/test_operations.py tests/ui" }
          - { name: S-plans, cov: "0", sel: "tests/session/test_plans.py tests/ui" }
          - { name: S-profile_transfer_ops, cov: "0", sel: "tests/session/test_profile_transfer_ops.py tests/ui" }
          - { name: S-saves_ops, cov: "0", sel: "tests/session/test_saves_ops.py tests/ui" }
          - { name: S-settings_ops, cov: "0", sel: "tests/session/test_settings_ops.py tests/ui" }
          - { name: S-shell_service, cov: "0", sel: "tests/session/test_shell_service.py tests/ui" }
          - { name: S-startup, cov: "0", sel: "tests/session/test_startup.py tests/ui" }
    name: ${{ matrix.name }}
    env:
      QT_QPA_PLATFORM: offscreen
      RS_UI_STALL_MS: 1500
      PYTHONFAULTHANDLER: "1"
      QT_LOGGING_RULES: "qt.qml*=true;qt.quick*=true"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: true
    - run: uv sync --locked
    - name: Run
      shell: bash
      run: |
        if [ "${{ matrix.cov }}" = "1" ]; then
          uv run coverage run -m pytest -v -p no:cacheprovider ${{ matrix.sel }}
        else
          uv run python -X faulthandler -m pytest -v -p no:cacheprovider ${{ matrix.sel }}
        fi
