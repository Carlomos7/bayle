name: Debug UI crash

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  ui:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Y1-ui-then-send-then-mods, nofix: "1", fake: "0", qapp: "0", sel: "tests/ui/views/test_activity_view.py tests/session/test_dbg_trash.py tests/ui/views/test_dnd_mods.py tests/ui/views/test_mods_view.py" }
          - { name: Y2-qapp-first-send-then-ui, nofix: "1", fake: "0", qapp: "1", sel: "tests/session/test_dbg_trash.py tests/ui" }
          - { name: Y3-send-then-ui-control, nofix: "1", fake: "0", qapp: "0", sel: "tests/session/test_dbg_trash.py tests/ui" }
    name: ${{ matrix.name }}
    env:
      QT_QPA_PLATFORM: offscreen
      RS_UI_STALL_MS: 1500
      PYTHONFAULTHANDLER: "1"
      DBG_QAPP_FIRST: ${{ matrix.qapp }}
      DBG_FAKETRASH: ${{ matrix.fake }}
      PYTHONPATH: .github/debug
      QT_LOGGING_RULES: "qt.qml*=true;qt.quick*=true"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: true
    - run: uv sync --locked
    - name: Probe COM state around the Recycle Bin call
      shell: bash
      run: uv run python .github/debug/com.py
    - name: Put the original trash.py back
      if: matrix.nofix == '1'
      shell: bash
      run: cp .github/debug/trash_orig.py src/bayle/platform/trash.py
    - name: Run
      shell: bash
      run: uv run python -X faulthandler -m pytest -v -p dbgplug -p no:cacheprovider ${{ matrix.sel }}
