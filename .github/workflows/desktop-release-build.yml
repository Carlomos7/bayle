# Builds Bayle's Windows installer exactly as a release would (the official identity, signed with the release update
# key) and checks the signature against the release public key, the way the updater will. A push publishes nothing.
# Started by hand with "publish", it also makes the GitHub release v<version> (a pre-release for X.Y.Z-…) with the installer and its
# signature (the update manifest is added on the updates branch afterwards, behind its own approval). ADR 0016.
name: Desktop release build

on:
  push:
    branches: [ "main" ]
    paths: [ "apps/desktop/**", "apps/engine/src/**", "apps/engine/uv.lock", ".github/workflows/desktop-release-build.yml" ]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the GitHub release v<version> with the signed installer (needs apps/desktop/release-notes/<version>.md)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    # The signing key lives only in this environment's secrets: every run waits for the owner's approval.
    environment: release-signing
    defaults:
      run:
        working-directory: apps/desktop
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: true
        cache-dependency-glob: apps/engine/uv.lock

    # pnpm's version comes from "packageManager" in apps/desktop/ui/package.json
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        package_json_file: apps/desktop/ui/package.json

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: apps/desktop/ui/pnpm-lock.yaml

    - name: UI dependencies (exactly as locked)
      run: pnpm install --frozen-lockfile
      working-directory: apps/desktop/ui

    - name: Freeze the engine
      run: uv run --locked --project ../engine python scripts/build_engine.py

    - name: Build and sign the installer (official identity)
      working-directory: apps/desktop/src-tauri
      env:
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      run: npx --yes @tauri-apps/cli@2.12.4 build --ci --config tauri.release.conf.json

    - name: The signature verifies against the release key
      shell: bash
      run: |
        exe=$(ls target/release/bundle/nsis/Bayle_*_x64-setup.exe)
        echo "built: $exe ($(stat -c %s "$exe") bytes)"
        BAYLE_SIGNED_FILE="$PWD/$exe" cargo test --locked -p bayle-desktop --test release_signature -- --ignored

    # only when publishing: the next job, which never sees the key, puts these on the release
    - if: inputs.publish
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: signed-installer
        path: |
          apps/desktop/target/release/bundle/nsis/Bayle_*_x64-setup.exe
          apps/desktop/target/release/bundle/nsis/Bayle_*_x64-setup.exe.sig
        if-no-files-found: error
        retention-days: 1

  publish:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # the release; its tag v<version> is made beforehand by an admin (the Release tags rule)
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Version, notes, the tag on this commit and no earlier release of it
      id: v
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
        cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' apps/desktop/src-tauri/Cargo.toml)
        [ "$version" = "$cargo" ] || { echo "::error::tauri.conf.json says $version, Cargo.toml $cargo"; exit 1; }
        case "$version" in 6.*-*) kind=--prerelease ;; 6.*) kind=--latest ;; *) echo "::error::$version is not a 6.x version"; exit 1 ;; esac
        notes="apps/desktop/release-notes/$version.md"
        [ -s "$notes" ] || { echo "::error::no release notes: $notes"; exit 1; }
        if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          echo "::error::v$version is already released"; exit 1
        fi
        # the commit the tag names (an annotated tag's ^{} line, else the tag itself)
        tagged=$(git ls-remote --tags origin "refs/tags/v$version" "refs/tags/v$version^{}" | sort -k2 | tail -1 | cut -f1)
        [ -n "$tagged" ] || { echo "::error::create the tag v$version on $GITHUB_SHA first (only admins may create v* tags)"; exit 1; }
        [ "$tagged" = "$GITHUB_SHA" ] || { echo "::error::v$version names $tagged, not this build's commit $GITHUB_SHA"; exit 1; }
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "notes=$notes" >> "$GITHUB_OUTPUT"
        echo "kind=$kind" >> "$GITHUB_OUTPUT"

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: signed-installer
        path: dist

    - name: The release
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.v.outputs.version }}
        KIND: ${{ steps.v.outputs.kind }}  # --prerelease (Beta only), or --latest for a stable release
      run: |
        exe="dist/Bayle_${VERSION}_x64-setup.exe"
        [ -s "$exe" ] && [ -s "$exe.sig" ] || { echo "::error::the signed installer of $VERSION is missing"; ls -la dist; exit 1; }
        gh release create "v$VERSION" "$exe" "$exe.sig" --repo "$GITHUB_REPOSITORY" --verify-tag \
          "$KIND" --title "Bayle $VERSION" --notes-file "${{ steps.v.outputs.notes }}"
        echo "Published v$VERSION at $GITHUB_SHA ($KIND). Next: its manifests on the updates branch." >> "$GITHUB_STEP_SUMMARY"
