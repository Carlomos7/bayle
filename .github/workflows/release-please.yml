name: Release Please

# On every push to main: open or update the release pull request (version bump + changelog from the Conventional
# Commits). Merging it makes release-please tag vX.Y.Z and create a DRAFT release holding the changelog section; then
# this workflow starts release.yml on that tag, which builds, signs, uploads into the draft and publishes it.
on:
  push:
    branches: [ "main" ]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
    - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
      id: rp
      with:
        config-file: release-please-config.json
        manifest-file: .release-please-manifest.json

    # A tag made with GITHUB_TOKEN does not trigger release.yml's push event; a workflow_dispatch does trigger
    # (the documented exception), and --ref makes github.ref the tag, so release.yml's checks work unchanged.
    - name: Start the build and publish workflow on the new tag
      if: ${{ steps.rp.outputs.release_created }}
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.rp.outputs.tag_name }}
      run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"

    # release-please's toml updater matches nothing for the uv.lock filter paths ("No entries modified"), and uv writes
    # the PEP 440 form (5.0.0rc3, not 5.0.0-rc.3), so uv regenerates the locks. Without this, release.yml's
    # `uv sync --locked` fails on the merged PR. A GITHUB_TOKEN push does not start test.yml on the PR.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: ${{ steps.rp.outputs.prs_created == 'true' }}
      with:
        ref: ${{ fromJSON(steps.rp.outputs.pr).headBranchName }}

    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      if: ${{ steps.rp.outputs.prs_created == 'true' }}

    - name: Re-lock the release PR branch
      if: ${{ steps.rp.outputs.prs_created == 'true' }}
      run: |
        for app in engine qt-desktop; do (cd "apps/$app" && uv lock); done
        git diff --quiet && exit 0
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -am "chore: re-lock uv.lock for the release version"
        git push
