name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  # uv's own Python builds (python-build-standalone), not the runner's preinstalled ones: the runner's python.org
  # 3.14.7 carries SQLite 3.50.4, below what the launcher's database needs (docs/decisions/0005-storage.md)
  UV_PYTHON_PREFERENCE: only-managed

# A newer push to the same branch or pull request makes the older run pointless.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - id: filter
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      with:
        # Pushes compare with the previous push to the same branch (a new branch compares with main);
        # pull requests compare with their base branch.
        base: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '' }}
        filters: |
          code:
            - "src/**"
            - "tests/**"
            - "scripts/**"
            - "docs/api/**"
            - "release-please-config.json"
            - "pyproject.toml"
            - "uv.lock"
            - ".python-version"
            - ".github/workflows/**"
          desktop:
            - "apps/desktop/**"
            - "packages/**"
            - "docs/api/openapi.json"
            - "package.json"
            - "pnpm-lock.yaml"
            - "pnpm-workspace.yaml"
            - ".github/workflows/**"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      RS_UI_STALL_MS: 1500  # shared runners render in software and stall far more than a real PC
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: true

    - name: Install Qt runtime libraries
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

    - name: Install dependencies (exactly as locked)
      run: uv sync --locked --all-extras

    - name: Lint and format
      run: |
        uv run ruff check .
        uv run ruff format --check .

    - name: Type check
      run: uv run pyright

    - name: Import layers
      run: uv run lint-imports --no-cache

    # The theme is generated from scripts/theme/tokens.json: a hand edit or a forgotten regeneration fails here,
    # and so does a colour pair under its contrast minimum (scripts/theme/README.md).
    - name: Theme tokens
      run: |
        uv run python scripts/theme/gen_theme.py --check
        uv run pytest -q tests/unit/test_theme_contrast.py

    # A route or schema change without a regenerated docs/api/openapi.json fails here; the web job then checks the TS client.
    - name: API contract and versions
      run: |
        uv run python scripts/export_openapi.py --check
        uv run python scripts/ci/check-versions.py

    - name: Run tests with coverage
      run: |
        uv run coverage erase
        uv run coverage run -m pytest
        uv run coverage report
        uv run coverage html

    - name: Upload HTML coverage report
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-html-${{ matrix.os }}
        path: htmlcov/
        retention-days: 14

  # The backend must install and import without Qt (no dev group: it carries the qt extra).
  headless:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: true

    - name: Install without Qt
      run: uv sync --locked --no-dev --no-extra qt

    - name: Import smoke
      run: |
        uv run --no-sync python -c "import bayle.app, bayle.services.play"
        uv run --no-sync python scripts/ci/headless-smoke.py

  # The desktop app (apps/desktop): front end on Linux, Rust shell and a release-profile build on both systems.
  web:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: pnpm

    - run: pnpm install --frozen-lockfile

    # The client is generated from docs/api/openapi.json and committed: a snapshot change without regenerating fails here.
    - name: Generated client is up to date
      run: |
        pnpm --filter @bayle/api generate
        git diff --exit-code -- packages/api/src/generated

    - name: Type check, lint, test, build
      run: |
        pnpm -r typecheck
        pnpm -r lint
        pnpm -r test
        pnpm --filter @bayle/desktop build

  rust:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Tauri system libraries
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: pnpm

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: apps/desktop/src-tauri

    - run: pnpm install --frozen-lockfile

    # The Rust build embeds the front end, so it is built first (tauri::generate_context! needs dist/).
    - name: Build the front end
      working-directory: apps/desktop
      run: pnpm build

    - name: Format, lint, test
      working-directory: apps/desktop/src-tauri
      run: |
        cargo fmt --check
        cargo clippy --all-targets --locked -- -D warnings
        cargo test --locked

    - name: Release-profile build (no installer, not published)
      working-directory: apps/desktop
      run: pnpm tauri build --no-bundle

  # The one check main requires: passes when the tests passed, or were skipped because only docs changed.
  tests-passed:
    needs: [changes, test, headless, web, rust]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Summarise
      env:
        CHANGES: ${{ needs.changes.result }}
        TESTS: ${{ needs.test.result }}
        HEADLESS: ${{ needs.headless.result }}
        WEB: ${{ needs.web.result }}
        RUST: ${{ needs.rust.result }}
      run: |
        echo "changes: $CHANGES, tests: $TESTS, headless: $HEADLESS, web: $WEB, rust: $RUST"
        [ "$CHANGES" = "success" ] || exit 1
        [ "$TESTS" = "success" ] || [ "$TESTS" = "skipped" ] || exit 1
        [ "$HEADLESS" = "success" ] || [ "$HEADLESS" = "skipped" ] || exit 1
        [ "$WEB" = "success" ] || [ "$WEB" = "skipped" ] || exit 1
        [ "$RUST" = "success" ] || [ "$RUST" = "skipped" ] || exit 1
