name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  # uv's own Python builds (python-build-standalone), not the runner's preinstalled ones: the runner's python.org
  # 3.14.7 carries SQLite 3.50.4, below what the launcher's database needs (docs/decisions/0005-storage.md)
  UV_PYTHON_PREFERENCE: only-managed

# A newer push to the same branch or pull request makes the older run pointless.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - id: filter
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      with:
        # Pushes compare with the previous push to the same branch (a new branch compares with main);
        # pull requests compare with their base branch.
        base: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '' }}
        filters: |
          code:
            - "apps/**"
            - "docs/api/**"
            - ".python-version"
            - ".github/workflows/**"

  # The engine alone: no PySide6 anywhere in its environment (gate G6), on both operating systems.
  engine:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/engine
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: true
        cache-dependency-glob: apps/engine/uv.lock

    - name: Install dependencies (exactly as locked)
      run: uv sync --locked

    - name: No Qt in the engine environment
      run: |
        uv run --no-sync python -c "import importlib.util as u, sys; sys.exit('PySide6 is installed' if u.find_spec('PySide6') else 0)"
        uv run --no-sync python -c "import bayle.cli, bayle.modules.launch.play"
        uv run --no-sync python ../qt-desktop/scripts/ci/headless-smoke.py

    - name: Lint and format
      run: |
        uv run ruff check .
        uv run ruff format --check .

    - name: Type check
      run: uv run pyright

    - name: Import layers
      run: uv run lint-imports --no-cache

    # A route or schema change without a regenerated docs/api/openapi.json fails here.
    - name: API contract
      run: uv run python scripts/export_openapi.py --check

    - name: Run tests with coverage
      run: |
        uv run coverage erase
        uv run coverage run -m pytest
        uv run coverage report
        uv run coverage html

    - name: Upload HTML coverage report
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-html-engine-${{ matrix.os }}
        path: apps/engine/htmlcov/
        retention-days: 14

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      RS_UI_STALL_MS: 1500  # shared runners render in software and stall far more than a real PC
    defaults:
      run:
        working-directory: apps/qt-desktop
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: true
        cache-dependency-glob: apps/*/uv.lock  # the engine is an editable path dependency

    - name: Install Qt runtime libraries
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

    - name: Install dependencies (exactly as locked)
      run: uv sync --locked

    - name: Lint and format
      run: |
        uv run ruff check .
        uv run ruff format --check .

    - name: Type check
      run: uv run pyright

    - name: Import layers
      run: uv run lint-imports --no-cache

    # The theme is generated from scripts/theme/tokens.json: a hand edit or a forgotten regeneration fails here,
    # and so does a colour pair under its contrast minimum (scripts/theme/README.md).
    - name: Theme tokens
      run: |
        uv run python scripts/theme/gen_theme.py --check
        uv run pytest -q tests/unit/test_theme_contrast.py

    - name: Run tests with coverage
      run: |
        uv run coverage erase
        uv run coverage run -m pytest
        uv run coverage report
        uv run coverage html

    - name: Self-test (from source)
      run: uv run python -m bayle_qt --self-test "$RUNNER_TEMP/self-test.txt"
      shell: bash

    - name: Upload HTML coverage report
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-html-${{ matrix.os }}
        path: apps/qt-desktop/htmlcov/
        retention-days: 14

  # The one check main requires: passes when the tests passed, or were skipped because only docs changed.
  tests-passed:
    needs: [changes, engine, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Summarise
      env:
        CHANGES: ${{ needs.changes.result }}
        ENGINE: ${{ needs.engine.result }}
        TESTS: ${{ needs.test.result }}
      run: |
        echo "changes: $CHANGES, engine: $ENGINE, tests: $TESTS"
        [ "$CHANGES" = "success" ] || exit 1
        [ "$TESTS" = "success" ] || [ "$TESTS" = "skipped" ] || exit 1
        [ "$ENGINE" = "success" ] || [ "$ENGINE" = "skipped" ] || exit 1
