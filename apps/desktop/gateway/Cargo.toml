[package]
name = "bayle-gateway"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The Rust side of ADR 0015: starts the Python engine, holds its port and token, forwards allowlisted calls and relays its events."

[dependencies]
eventsource-stream = "0.2.3"
futures-util = "0.3.34"
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
url = "2.5.8"

[build-dependencies]
serde_json = "1.0.154"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"
