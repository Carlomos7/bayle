[package]
name = "bayle-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Bayle's Tauri shell (Phase 0): the gateway behind a development page."

[dependencies]
bayle-gateway = { version = "0.1.0", path = "../gateway" }
serde_json = "1.0.154"
tauri = "2.12.5"
tokio = { version = "1.54.1", features = ["sync"] }

[build-dependencies]
tauri-build = "2.7.4"
