[project]
name = "bayle-engine"
version = "4.6.0-rc.3"
description = "The Bayle engine: mods, profiles, saves, merging and the game's files, as typed Python interfaces. No UI."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Carlos Ray Segarra" }]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.5",
    "py7zr>=1.1.3",
    "cryptography>=50.0.1",
    "constrata>=1.3.3",
    "sqlalchemy>=2.1.3,<3",  # 2.x: typed DeclarativeBase, Mapped[], mapped_column (storage/)
    "alembic>=1.20.0",  # adapters/persistence/migrations, run in code at start-up
    "lupa>=2.8,<3",  # Lua 5.1 compiler: composed character scripts are checked before a build is used (decision 0006)
    "tomlkit==0.15.1",
]

[project.scripts]
bayle-engine = "bayle.cli:main"  # the headless modes; the desktop program is bayle-qt's `bayle`

[project.optional-dependencies]
api = ["fastapi>=0.159.1", "uvicorn>=0.54.0", "pydantic-settings>=2.16.1"]

[dependency-groups]
dev = [
    "bayle-engine[api]",
    "pytest>=9.0.2",
    "httpx>=0.28.1",
    "coverage>=7.13.0",
    "ruff>=0.16.9",
    "pyright>=1.1.414",
    "import-linter>=2.15",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bayle"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
# importlib mode puts no test folder on sys.path, so the shared helpers (support, fakegame...) come from here
pythonpath = ["tests", "tests/unit"]
markers = [
    "integration: needs a real Elden Ring save named by ROUNDTABLE_TEST_SAVE (skipped otherwise)",
    "real_recycle_bin: sends to the real Windows Recycle Bin; runs last",
]

[tool.coverage.run]
branch = true
source = ["src/bayle"]

[tool.coverage.report]
show_missing = true
precision = 2

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E731", "E741", "B008", "B905"]

[tool.pyright]
include = ["src", "scripts", "tests"]
extraPaths = ["tests", "tests/unit"]  # what pytest's pythonpath puts on sys.path
pythonVersion = "3.14"
typeCheckingMode = "standard"
# The dict-shaped save data trips these without pointing at bugs; they stay visible as warnings.
reportAttributeAccessIssue = "warning"
reportArgumentType = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalSubscript = "warning"
reportOptionalIterable = "error"
reportGeneralTypeIssues = "warning"
reportIndexIssue = "error"
reportCallIssue = "warning"
reportOperatorIssue = "warning"

# Production source is held to the strict setting; tests and scripts keep the warning above.
[[tool.pyright.executionEnvironments]]
root = "src"
reportAttributeAccessIssue = "error"

[[tool.pyright.executionEnvironments]]
root = "."

# Import layers (technical specification §8.6). Each package may import only from the ones below it; "|" marks
# siblings that may not import each other. Run: uv run lint-imports --no-cache
[tool.importlinter]
root_package = "bayle"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The engine has no Qt and knows no app"
type = "forbidden"
source_modules = ["bayle"]
forbidden_modules = ["PySide6", "shiboken6", "bayle_qt", "velopack"]
